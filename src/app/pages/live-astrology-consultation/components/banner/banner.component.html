<section class="banner-section rounded-banner">
  <!-- HTML5 AI Consultation Background Video -->
  <div class="video-bg-container">
    <video autoplay loop muted playsinline [muted]="true" oncanplay="this.play()"
      onloadedmetadata="this.muted = true; this.play();" class="video-bg">
      <source src="/assets/videos/astroved_hero_video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>
  </div>

  <div class="banner-container">
    <div class="banner-content-left">

      <!-- Text Content & Category Badge Options (First Image copy) -->
      <div class="banner-text-content animate-slide-in">
        
        <!-- Premium Glowing Badge -->
        <div class="premium-badge">
           <span class="pulse-dot"></span>
           <span class="badge-text">India's Most Trusted Vedic Platform</span>
        </div>

        <h1 class="banner-title">
          Find Clarity, Get Guidance.<br>
          <span class="highlight-gradient animated-shine-text">Transform Your Life</span>
        </h1>

        <p class="banner-subtitle">
          Talk to India's best Astrologers and get solutions to your life problems.
        </p>

        <!-- CTA Buttons -->
        <div class="cta-buttons">
          <a href="#" class="btn-primary cta-btn glow-pulse-btn">
            <span>BOOK CONSULTATION</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
