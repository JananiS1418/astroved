<section class="astrologers-section bg-light">
  <div class="section-container">
    <h2 class="section-title text-center">Meet Our Expert Astrologers</h2>
    <p class="section-subtitle text-center">Connect with highly qualified, verified Vedic astrologers from India.</p>
    
    <div class="astrologers-grid">
      <div class="astrologer-card" *ngFor="let astro of astrologers">
        <div class="astro-header">
          <div class="astro-image-wrap">
            <img [src]="astro.image" [alt]="astro.name" class="astro-img">
            <span class="online-status" [ngClass]="astro.status"></span>
          </div>
          <div class="astro-basic-info">
            <h3 class="astro-name">{{ astro.name }}</h3>
            <div class="astro-rating">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#FFC107" stroke="#FFC107" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>{{ astro.rating }}</span>
            </div>
            <p class="astro-experience">{{ astro.experience }}</p>
          </div>
        </div>
        <div class="astro-details">
          <div class="detail-row">
            <span class="detail-label">Skills:</span>
            <span class="detail-val">{{ astro.skills }}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Languages:</span>
            <span class="detail-val">{{ astro.languages }}</span>
          </div>
          <div class="detail-row price-row">
            <span class="detail-label">Price:</span>
            <span class="detail-val price-highlight">{{ astro.price }}</span>
          </div>
        </div>
        <div class="astro-actions">
          <button class="btn-outline view-profile-btn">View Profile</button>
          <button class="btn-primary book-btn">Book Now</button>
        </div>
      </div>
    </div>
  </div>
</section>
