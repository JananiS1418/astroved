<section class="booking-info-section">
  <div class="section-container">
    <div class="booking-banner">
      <div class="booking-content-left">
        <h2 class="booking-title">Consultation Options</h2>
        <div class="pricing-cards">
          <div class="price-card">
            <span class="duration">30 Minutes</span>
            <span class="price">$45.00</span>
          </div>
          <div class="price-card highlight">
            <span class="duration">60 Minutes</span>
            <span class="price">$80.00</span>
            <span class="save-badge">Save 11%</span>
          </div>
        </div>
      </div>
      
      <div class="booking-content-right">
        <div class="info-controls">
          <div class="control-group">
            <label>Language</label>
            <div class="custom-select">
              <select>
                <option>English</option>
                <option>Hindi</option>
                <option>Tamil</option>
              </select>
            </div>
          </div>
          <div class="control-group">
            <label>Current Time Zone</label>
            <div class="tz-display">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>IST (UTC +5:30)</span>
            </div>
          </div>
        </div>
        <div class="slot-legends">
          <div class="legend-item"><span class="dot green"></span> Slot Available</div>
          <div class="legend-item"><span class="dot red"></span> Slot Booked</div>
        </div>
      </div>
    </div>
  </div>
</section>
